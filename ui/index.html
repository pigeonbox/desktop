<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PigeonBox</title>
  <style>
    /* 设计 token 对齐 frontend-core(清新柔和风):品牌靛蓝点睛 + 中性灰阶 */
    :root {
      color-scheme: light dark;
      --primary: #5e6ad2;
      --primary-hover: #7b85da;
      --primary-active: #424a93;
      --primary-bg: #eff0fb;
      --primary-ring: rgba(94, 106, 210, 0.16);

      --bg: #f5f6f8;
      --surface: #ffffff;
      --tint: #f7f8fa;
      --border-soft: #e7e8ec;
      --border: #d6d8de;

      --text-1: #0a0a0a;
      --text-2: #404040;
      --text-3: #737373;
      --text-4: #a3a3a3;

      --danger: #dc2626;
      --success: #15803d;
      --success-bg: #f0fdf4;

      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;

      --shadow-card: 0 24px 56px -20px rgba(16, 18, 24, 0.16), 0 4px 12px -4px rgba(16, 18, 24, 0.06);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #8e97e0;
        --primary-hover: #767eb9;
        --primary-active: #b0b6e9;
        --primary-bg: rgba(142, 151, 224, 0.14);
        --primary-ring: rgba(142, 151, 224, 0.22);

        --bg: #0a0a0a;
        --surface: #141414;
        --tint: #17181c;
        --border-soft: #262629;
        --border: #33363f;

        --text-1: #fafafa;
        --text-2: #d4d4d4;
        --text-3: #a3a3a3;
        --text-4: #737373;

        --success: #4ade80;
        --success-bg: rgba(74, 222, 128, 0.12);

        --shadow-card: 0 24px 56px -20px rgba(0, 0, 0, 0.65), 0 4px 12px -4px rgba(0, 0, 0, 0.45);
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      display: flex; min-height: 100vh; padding: 28px 24px;
      font-family: var(--font); color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(155deg, #eff0fb 0%, var(--bg) 45%, #eceef4 100%);
    }
    @media (prefers-color-scheme: dark) {
      body { background: radial-gradient(1100px 480px at 50% -8%, rgba(142, 151, 224, 0.12), transparent 70%), var(--bg); }
      .btn-primary { color: #14141a; }
    }

    .shell {
      margin: auto; width: 100%; max-width: 920px;
      background: var(--surface); border: 1px solid var(--border-soft);
      border-radius: var(--radius-xl); box-shadow: var(--shadow-card);
    }

    /* ── 头部 ── */
    .head { display: flex; align-items: center; gap: 14px; padding: 22px 28px; border-bottom: 1px solid var(--border-soft); }
    .head img {
      width: 46px; height: 46px; border-radius: 11px; display: block;
      box-shadow: 0 6px 16px rgba(94, 106, 210, 0.28);
    }
    .head h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
    .head p { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }

    /* ── 双面板:左=服务器连接(主),右=设备直传(次) ── */
    .body { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 22px 22px 22px; }
    .tile {
      display: flex; flex-direction: column;
      background: var(--tint); border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg); padding: 20px;
    }
    .tile-head { display: flex; align-items: center; gap: 8px; }
    .tile-icon { width: 17px; height: 17px; color: var(--primary); }
    .tile-title { font-size: 15px; font-weight: 600; }
    .tile-sub { font-size: 12px; line-height: 1.7; color: var(--text-3); margin: 7px 0 16px; }
    .spacer { flex: 1; min-height: 16px; }
    .tip { font-size: 12px; line-height: 1.7; color: var(--text-3); }
    .pane-form { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 14px; }

    .pill {
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
      color: var(--primary); background: var(--primary-bg);
      padding: 2px 9px; border-radius: 999px;
    }

    .field-label {
      display: block; font-size: 12.5px; font-weight: 500;
      color: var(--text-3); letter-spacing: 0.2px; margin-bottom: 7px;
    }
    .field { margin-bottom: 14px; }

    input {
      width: 100%; height: 42px; padding: 0 13px;
      font-family: var(--font); font-size: 14px; color: var(--text-1);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input::placeholder { color: var(--text-4); }
    input:hover:not(:disabled) { border-color: var(--text-4); }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
    input:disabled { background: var(--tint); color: var(--text-4); cursor: not-allowed; }

    button {
      display: inline-flex; align-items: center; justify-content: center;
      height: 42px; padding: 0 18px; white-space: nowrap;
      font-family: var(--font); font-size: 14px; font-weight: 500;
      border: 1px solid transparent; border-radius: var(--radius-md);
      cursor: pointer; user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    .btn-primary { background: var(--primary); color: #fff; padding: 0 24px; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-primary:active:not(:disabled) { background: var(--primary-active); }
    .btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text-2); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .btn-quiet { background: transparent; border-color: var(--border-soft); color: var(--text-3); }
    .btn-quiet:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
    .btn-block { width: 100%; }

    .input-row { display: flex; gap: 10px; }
    .input-row input { flex: 1; min-width: 0; }
    .input-row button { flex: 0 0 auto; }

    .err { font-size: 12.5px; line-height: 1.5; color: var(--danger); margin-top: 8px; }
    .err:empty { display: none; }

    .code {
      display: none; padding: 11px 14px; text-align: center;
      font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: 2.5px;
      color: var(--primary); background: var(--primary-bg);
      border-radius: var(--radius-md); user-select: all;
    }
    .code.ok { color: var(--success); background: var(--success-bg); }
    .log {
      display: none; margin-top: 10px; padding: 10px 12px;
      background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
      font: 11px/1.55 var(--mono); color: var(--text-2);
      max-height: 140px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    }
    #p2p-cancel { margin-top: 12px; }

    @media (max-width: 820px) {
      .body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <img src="favicon.svg" alt="PigeonBox" width="46" height="46" />
      <div>
        <h1>PigeonBox 桌面版</h1>
        <p>连接你的文件快递柜服务器</p>
      </div>
    </header>
    <div class="body">
      <section class="tile">
        <div class="tile-head">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="6" rx="2" />
            <rect x="3.5" y="13.5" width="17" height="6" rx="2" />
            <path d="M7 7.5h.01M7 16.5h.01" />
          </svg>
          <span class="tile-title">连接服务器</span>
        </div>
        <p class="tile-sub">连接后本窗口即服务器完整界面；已保存的服务器会自动重连。</p>

        <div class="pane-form">
          <label class="field-label" for="url">服务器地址</label>
          <div class="input-row">
            <input id="url" placeholder="如 http://10.44.129.215" spellcheck="false" autocapitalize="off" autocomplete="off" />
            <button class="btn-primary" id="go" onclick="connect()">连接</button>
          </div>
          <div class="err" id="err"></div>
        </div>

        <p class="tip">托盘菜单可随时返回本设置页或退出。</p>
      </section>

      <section class="tile">
        <div class="tile-head">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 4v13M4 14l3 3 3-3" />
            <path d="M17 20V7M14 10l3-3 3 3" />
          </svg>
          <span class="tile-title">设备直传</span>
          <span class="pill">P2P</span>
        </div>
        <p class="tile-sub">经中继/打洞端到端直传，文件不落服务器、服务端只见密文。</p>

        <label class="field-label" for="p2p-registry">直传注册中心</label>
        <div class="field">
          <input id="p2p-registry" placeholder="如 http://p2p.example.com:12346" spellcheck="false" autocapitalize="off" autocomplete="off" />
        </div>

        <div class="field-label">发送文件</div>
        <div class="field">
          <button class="btn-ghost btn-block" id="pick" onclick="pickAndSend()">选择文件发送…</button>
        </div>

        <label class="field-label" for="p2p-code">接收文件</label>
        <div class="field input-row">
          <input id="p2p-code" placeholder="对方口令，如 XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="off" autocomplete="off" />
          <button class="btn-ghost" id="recv" onclick="recv()">按口令接收</button>
        </div>

        <div class="code" id="p2p-mycode"></div>
        <pre class="log" id="p2p-log"></pre>
        <button class="btn-quiet btn-block" id="p2p-cancel" style="display:none" onclick="cancel()">取消传输</button>
        <div class="err" id="p2p-err"></div>

        <div class="spacer"></div>
        <p class="tip" id="p2p-note">接收的文件存入系统下载目录；直传需要可达的 p2pd 注册中心。</p>
      </section>
    </div>
  </main>

  <script>
    const { invoke } = window.__TAURI__.core;
    const $ = id => document.getElementById(id);

    window.addEventListener('DOMContentLoaded', async () => {
      // 设备直传面板初始化(独立于服务器连接)
      try {
        $('p2p-registry').value = await invoke('get_p2p_registry');
        await invoke('p2p_version'); // 探测 sidecar,失败则提示
      } catch (e) {
        $('p2p-note').textContent = '设备直传不可用：内置 p2pc 缺失（' + String(e).slice(0, 80) + '）';
        for (const id of ['pick', 'recv', 'p2p-code', 'p2p-registry']) $(id).disabled = true;
      }
      const { listen } = window.__TAURI__.event;
      await listen('p2p-log', ev => onP2pLog(ev.payload));

      // 服务器连接(原有逻辑)
      const saved = await invoke('get_saved');
      if (saved) {
        $('url').value = saved;
        try { await connect(); return; } catch (_) {}
        $('go').disabled = false;
      }
      $('url').focus();
      $('url').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
      $('p2p-code').addEventListener('keydown', e => { if (e.key === 'Enter') recv(); });
    });

    async function connect() {
      let url = $('url').value.trim();
      // 明文 HTTP 确认（2026-10-05 审计：无 scheme 时 Rust 侧默认补 http://，
      // 内网 NAS 场景保留该便利，但须用户知情——凭据与分享内容明文传输）
      const target = url.startsWith('http://') ? url
        : (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url) && !/^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?(\/|$)/.test(url)) ? 'http://' + url
        : null;
      const eff = target || url;
      if (eff.startsWith('http://')) {
        const host = eff.replace(/^http:\/\//, '').split(/[\/ :]/)[0];
        // 内网/回环免确认:主机名精确匹配,或私网段前缀
        // (2026-10-11 修复:原模式尾部误留一个字面空格,导致 10./192.168. 等
        // 内网地址永远判不中,每个 http:// 地址都弹明文确认框)
        const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(host) ||
          /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host);
        if (!local && !confirm('将以明文 HTTP 连接（内容与凭据不加密传输）。\n' + eff + '\n\n继续连接吗？')) {
          return;
        }
      }
      $('err').textContent = '';
      $('go').disabled = true;
      try {
        await invoke('connect', { url });
      } catch (e) {
        $('err').textContent = String(e);
        $('go').disabled = false;
      }
    }

    // ── 设备直传 ──
    let transferDone = true;

    async function pickAndSend() {
      resetP2p();
      const path = await window.__TAURI__.dialog.open({ multiple: false });
      if (!path) return;
      start('send', { filePath: path });
    }
    async function recv() {
      resetP2p();
      const code = $('p2p-code').value.trim();
      if (!code) { $('p2p-err').textContent = '请输入口令'; return; }
      start('recv', { code });
    }
    async function start(cmd, extra) {
      const registry = $('p2p-registry').value.trim();
      if (!registry) { $('p2p-err').textContent = '请填写直传注册中心地址'; return; }
      $('p2p-err').textContent = '';
      setBusy(true, cmd === 'send' ? '发送中…' : '接收中…');
      try {
        await invoke(cmd === 'send' ? 'p2p_send' : 'p2p_recv', { registry, ...extra });
        transferDone = false;
      } catch (e) {
        $('p2p-err').textContent = String(e);
        setBusy(false);
      }
    }
    async function cancel() {
      try { await invoke('p2p_cancel'); } catch (_) {}
    }

    function onP2pLog(p) {
      const log = $('p2p-log');
      log.style.display = 'block';
      if (p.kind === 'stdout') {
        log.textContent += p.line + '\n';
        log.scrollTop = log.scrollHeight;
        // send 会打印口令 XXXX-XXXX-XXXX,提取后大字展示
        const m = p.line.match(/\b([A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4})\b/);
        if (m && !transferDone && !$('p2p-mycode').textContent) {
          $('p2p-mycode').textContent = m[1];
          $('p2p-mycode').style.display = 'block';
        }
      } else if (p.kind === 'stderr' || p.kind === 'error') {
        log.textContent += p.line + '\n';
        log.scrollTop = log.scrollHeight;
      } else if (p.kind === 'exit') {
        transferDone = true;
        setBusy(false);
        if (p.code === 0) {
          $('p2p-mycode').classList.add('ok');
          if (!$('p2p-mycode').textContent) $('p2p-mycode').textContent = '✓ 传输完成';
          if ($('p2p-mycode').textContent.startsWith('✓') === false) $('p2p-mycode').textContent += ' ✓';
        } else {
          $('p2p-err').textContent = '传输异常退出（code ' + p.code + '），详见日志';
        }
      }
    }
    function resetP2p() {
      $('p2p-err').textContent = '';
      $('p2p-mycode').textContent = '';
      $('p2p-mycode').style.display = 'none';
      $('p2p-mycode').classList.remove('ok');
      $('p2p-log').textContent = '';
      $('p2p-log').style.display = 'none';
    }
    function setBusy(busy, label) {
      for (const id of ['pick', 'recv', 'p2p-code', 'p2p-registry']) $(id).disabled = busy;
      $('p2p-cancel').style.display = busy ? 'block' : 'none';
      if (busy) $('p2p-cancel').textContent = label || '取消传输';
    }
  </script>
</body>
</html>

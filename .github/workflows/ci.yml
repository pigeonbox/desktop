name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux 依赖(Tauri webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      # 编译门禁：此前仓内无任何 CI 检查，编译回归要到发版打包才暴露
      # Cargo.toml 在 src-tauri/ 子目录，cargo 全程带 manifest-path
      - name: cargo check
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml
      - name: cargo test
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml
      # 测试数下限守卫（2026-10-26 审计 P1）：此前 `cargo test` 恒绿但**零
      # 断言**——URL 归一、设置页导航、config.json 持久化三条最易回归的路径
      # 无任何自动化保护（托盘「服务器设置」失效与 URL 大小写不敏感缺陷正是
      # 因此长期未被发现）。断言已注册测试数 ≥ 下限，避免测试面再次退化成
      # 空跑（下限随新增用例上调）。
      # 2026-11-01：一等取件端落地后下限 9 → 51（新增待取判定、剪贴板
      # 「只放 6 位取件码」的硬边界、到件通知解析、API Key 形状校验、
      # Box 客户端 URL/鉴权头/真 HTTP 往返（打本地 mock Box）、
      # 托盘清单与本地 origin 闸等用例）。
      - name: 测试数下限守卫
        run: |
          n=$(cargo test --workspace --manifest-path src-tauri/Cargo.toml -- --list 2>/dev/null | grep -c ': test$' || true)
          echo "已注册测试数: $n"
          if [ "$n" -lt 51 ]; then
            echo "✗ 测试数 $n < 51：测试面退化成空跑"
            exit 1
          fi
      # 告警先观察，收敛为 0 后再加 -D warnings 升门禁
      - name: cargo clippy
        run: cargo clippy --workspace --manifest-path src-tauri/Cargo.toml

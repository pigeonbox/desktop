# Dependabot 依赖保活。go.mod 不进 Dependabot：生态模块版本由发布列车
# (hub release/train.yaml → make train-bump) 统一收口，双头管理必漂移。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    # Cargo.toml 在 src-tauri/（工作区唯一 crate）；指 / 会 dependency_file_not_found
    # ⇒ cargo 更新自配置以来一直静默失败（Dependabot Updates 红于 2026-11-12）。
    directory: /src-tauri
    schedule:
      interval: weekly
